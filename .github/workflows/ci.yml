name: Continuous Integration & Verification

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

permissions:
  contents: write

jobs:
  test:
    name: 53-Pair Matrix Test & Pre-flight Verification
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg || true

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg || true

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y || true

      - name: Run Exhaustive 53-Pair Matrix Test Suite
        run: npm test

      - name: AutoAthera CI - Commit and Push Generated Matrix Test Artifacts
        if: runner.os == 'Linux' && github.event_name == 'push'
        run: |
          git config --global user.name "AutoAthera CI"
          git config --global user.email "autoathera@pyintel.cc"
          git add test/artifacts/
          git status
          git diff --quiet && git diff --staged --quiet || (git commit -m "ci(AutoAthera): Auto-commit 53-pair verified matrix test artifacts [skip ci]" && git push)
